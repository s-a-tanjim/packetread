[package]
name = "packetread"
version = "0.1.0"
edition = "2021"
description = "A colorful, mouse-friendly terminal packet inspector"

[dependencies]
aes = "0.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
pcap = "2.5"
pcap-parser = "0.17"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
regex = "1.13.1"
ring = "0.17.14"
rsa = "0.9"
signal-hook = "0.4.6"

[profile.release]
lto = "thin"
codegen-units = 1

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

